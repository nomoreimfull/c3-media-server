## Managed component dependencies (fetched by the IDF Component Manager on build).
dependencies:
  ## mDNS gives the box a friendly hostname on the AP (nice-to-have; DLNA discovery
  ## itself uses SSDP, not mDNS). "*" lets the manager pick a version compatible
  ## with the installed IDF.
  espressif/mdns: "*"
  idf:
    version: ">=5.1"
